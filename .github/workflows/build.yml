name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
      - run: flutter create . --platforms=android --project-name nexora --org com.nexora
      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Disable Android lint vital checks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) { t.enabled = false }
            }
          }
          EOF
      - run: flutter pub get
      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log
      - name: Show error summary
        if: failure()
        run: |
          MSG=$(grep -iE -B1 -A8 "what went wrong|error:|failed to|exception" build.log | head -60 | tr '\n' '|' | sed 's/%/%25/g' || true)
          echo "::error title=Build failure details::${MSG:-no match}"
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
