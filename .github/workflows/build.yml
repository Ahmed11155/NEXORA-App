name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --project-name nexora --org com.nexora
      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Build APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log
      - name: Show error summary
        if: failure()
        run: grep -n -B2 -A12 -iE "what went wrong|error:|FAILURE" build.log | head -120
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-apk
          path: build/app
